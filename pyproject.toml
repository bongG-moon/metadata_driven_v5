[project]
name = "metadata-driven-v5"
version = "0.1.0"
description = "Metadata-driven manufacturing agent v5 standalone runtime"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.111,<1.0",
  "pandas>=2.0",
  "pymongo>=4.0",
  "requests>=2.31",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
langflow_1_11 = [
  "langflow==1.11.0",
  "langflow-base==0.11.0",
  "lfx==1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
